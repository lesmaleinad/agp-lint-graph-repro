buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:${project.property('agpVersion')}"
        // Select a newer Kotlin version for AGP's built-in Kotlin integration.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${project.property('kotlinVersion')}"
    }
}

repro.LintGraphPatch.install(gradle)

def withApp = providers.gradleProperty('withApp').getOrElse('false').toBoolean()
subprojects {
    apply plugin: (withApp && name == 'module01' ? 'com.android.application' : 'com.android.library')
    android {
        namespace = 'example.repro'
        compileSdk = 36
        defaultConfig { minSdk = 23 }
        compileOptions {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        }
        sourceSets.main {
            manifest.srcFile(rootProject.file('src/main/AndroidManifest.xml'))
            kotlin.srcDirs(rootProject.file('src/main/kotlin'))
        }
    }
}

def graphNodes = project.property('graphNodes').toInteger()
if (graphNodes <= subprojects.size() || graphNodes > 1000000) {
    throw new GradleException('graphNodes must exceed moduleCount and be at most 1000000')
}

// NODES - 1 leaves spread across modules, plus the root benchmarkGraph task.
def leaves = []
subprojects.sort { it.name }.eachWithIndex { module, moduleIndex ->
    def count = (graphNodes - 1).intdiv(subprojects.size())
    if (moduleIndex < (graphNodes - 1) % subprojects.size()) count++
    (1..count).each { index ->
        leaves.add(module.tasks.register(String.format('node%06d', index)))
    }
}
tasks.register('benchmarkGraph') { dependsOn(leaves) }

// For the lint comparison, print the states that --dry-run does not show.
if (withApp) {
    gradle.projectsEvaluated {
        gradle.taskGraph.whenReady { graph ->
            graph.allTasks.findAll { it.name.startsWith('lintVital') }.each { task ->
                println "LINT_TASK ${task.path} enabled=${task.enabled}"
            }
        }
    }
}
